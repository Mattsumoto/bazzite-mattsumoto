# ASUS PCE-AC88 / Broadcom BCM4366 (14e4:43c3)
#
# The out-of-tree Broadcom STA driver (wl) does NOT support 4366 but will
# happily bind first and leave you with no interface at all. Keep it out of
# the way so brcmfmac gets the device.
blacklist wl
blacklist b43
blacklist b43legacy
blacklist brcmsmac
blacklist bcma
