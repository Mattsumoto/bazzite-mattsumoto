# Live ISO boot configuration, consumed by titanoboa via
# /usr/lib/bootc-image-builder/iso.yaml inside the installer image.
#
# These entries deliberately match Bazzite's own (installer/iso.yaml upstream).
#
# DO NOT add nvidia_drm.modeset=1 / nvidia_drm.fbdev=1 here. An earlier revision
# did, on the theory that it would keep the Odyssey G9 stable during install.
# The live environment is the plain non-NVIDIA Bazzite image - it has no NVIDIA
# kernel module - so those arguments told the kernel to hand display over to a
# driver that never loads. Result: a completely black screen with no console,
# and no way to install anything.
#
# The installed system gets its NVIDIA arguments from /usr/lib/bootc/kargs.d/,
# which is the right place for them. If the installer flickers on the G9, use
# the Basic Graphics entry below.
#
# label must match root=live:CDLABEL= below, or the live root is not found.

label: "Bazzite-Live"
grub2:
  timeout: 10
  default: 0
  entries:
    - name: "Launch Bazzite Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Bazzite-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"

    - name: "Launch Bazzite Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Bazzite-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
