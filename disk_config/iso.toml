# Anaconda ISO configuration.
#
# build-disk.yml passes this file to bootc-image-builder when disk-type is
# anaconda-iso. The kickstart below runs inside the installer and rebases the
# freshly installed system onto our custom image, so the machine boots with the
# hardware fixes already in place - no post-install steps.
#
# The image reference must be a literal; it is not templated by the workflow.

[customizations.installer.kickstart]
contents = """
%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/mattsumoto/bazzite-mattsumoto:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
