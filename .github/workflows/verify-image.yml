---
name: Verify image

# Inspects the published image and asserts the fixes are present and that we
# have not broken anything relative to the base image.
#
# The repo check compares against ghcr.io/ublue-os/bazzite-nvidia-open:stable
# rather than asserting an absolute state. An earlier build.sh disabled Fedora's
# repositories while the build stayed green, so the guard matters - but only a
# *divergence from base* is a fault. Bazzite may legitimately ship repos
# disabled, and asserting otherwise just produces false alarms.
#
# Cheap (pull + inspect, no build), so run it after any change.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # Mondays, to catch upstream drift

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  BASE_IMAGE: "ghcr.io/ublue-os/bazzite-nvidia-open:stable"

jobs:
  verify:
    name: Verify image contents
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Resolve image reference
        id: ref
        run: echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Pull images
        run: |
          set -euxo pipefail
          podman pull "${{ steps.ref.outputs.image }}"
          podman pull "${BASE_IMAGE}"

      - name: Verify our additions are present
        run: |
          set -euo pipefail
          cat > /tmp/verify.sh <<'VERIFY'
          #!/usr/bin/bash
          fails=0
          ok()   { printf '  [ok]   %s\n' "$*"; }
          bad()  { printf '  [FAIL] %s\n' "$*"; fails=$((fails+1)); }
          info() { printf '  [--]   %s\n' "$*"; }
          check(){ if eval "$2" >/dev/null 2>&1; then ok "$1"; else bad "$1"; fi; }

          echo "=== hardware fix files ==="
          check "kargs.d present"              'test -f /usr/lib/bootc/kargs.d/10-rog-x570-rtx3080.toml'
          check "rootfs declaration present"   'test -f /usr/lib/bootc/install/50-bazzite-mattsumoto.toml'
          check "nvidia modprobe conf"         'test -f /usr/lib/modprobe.d/nvidia-rtx3080.conf'
          check "broadcom modprobe conf"       'test -f /usr/lib/modprobe.d/broadcom-bcm4366.conf'
          check "AC88 firmware blob"           'test -f /usr/share/bazzite-hw-fixes/firmware/brcmfmac4366c-pcie.bin.ac88u'
          check "samsung EDID"                 'test -f /usr/lib/firmware/edid/samsung-g91sd-base.bin'
          check "g9-display executable"        'test -x /usr/bin/g9-display'
          check "broadcom-wifi-fix executable" 'test -x /usr/bin/broadcom-wifi-fix'
          check "hw-fixes executable"          'test -x /usr/bin/hw-fixes'

          echo "=== helper scripts are syntactically valid ==="
          for s in g9-display broadcom-wifi-fix hw-fixes; do
            check "bash -n $s" "bash -n /usr/bin/$s"
          done

          echo "=== stock Broadcom firmware (informational) ==="
          if [ -f /usr/lib/firmware/brcm/brcmfmac4366c-pcie.bin ]; then
            info "stock brcmfmac4366c-pcie.bin present - AC88 override is a fallback"
          else
            info "stock brcmfmac4366c-pcie.bin ABSENT - the AC88 override is REQUIRED for any chance of wifi"
          fi

          echo "=== declared kernel arguments ==="
          grep -E '^\s*"' /usr/lib/bootc/kargs.d/10-rog-x570-rtx3080.toml | tr -d ' ",' | sed 's/^/  /'

          echo "=== declared root filesystem ==="
          grep -A1 'filesystem.root' /usr/lib/bootc/install/50-bazzite-mattsumoto.toml | sed 's/^/  /'

          echo
          if [ "$fails" -ne 0 ]; then echo "FAILED CHECKS: $fails"; exit 1; fi
          echo "Additions verified."
          VERIFY
          podman run --rm --entrypoint "" -v /tmp/verify.sh:/verify.sh:ro,z \
            "${{ steps.ref.outputs.image }}" /usr/bin/bash /verify.sh

      - name: Compare repo state against the base image
        run: |
          set -euo pipefail
          dump() {
            podman run --rm --entrypoint "" "$1" /usr/bin/bash -c '
              for f in /etc/yum.repos.d/*.repo; do
                [ -e "$f" ] || continue
                # First enabled= line per file is a good enough proxy for the file state.
                state=$(grep -m1 -E "^enabled *=" "$f" | tr -d " " || echo "enabled=unset")
                printf "%s %s\n" "$(basename "$f")" "$state"
              done | sort'
          }
          dump "${{ steps.ref.outputs.image }}" > /tmp/ours.txt
          dump "${BASE_IMAGE}"                  > /tmp/base.txt

          echo "=== base image repo states (for reference) ==="
          sed 's/^/  /' /tmp/base.txt
          echo
          echo "=== diff: base vs ours ==="
          if diff -u /tmp/base.txt /tmp/ours.txt; then
            echo "  identical to base - our layer altered no repository"
          else
            echo
            echo "FAIL: our layer changed repository state relative to the base image."
            exit 1
          fi
