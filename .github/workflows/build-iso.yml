---
name: Build live ISO

# Builds a live installer ISO with titanoboa, mirroring how Bazzite builds its
# own (ublue-os/bazzite/.github/workflows/build_iso.yml).
#
# Two images are involved and they are not the same thing:
#   BASE_IMAGE            - the live environment you boot into from the USB
#   INSTALL_IMAGE_PAYLOAD - the image written to disk by the installer
#
# The live runtime MUST be the plain, non-NVIDIA Bazzite image. Bazzite strips
# -nvidia/-nvidia-open from the ref for exactly this reason:
#
#   # We need this as we use the desktop image as the runtime for the livecds.
#   ref="${ref/-nvidia-open/}"
#
# A previous revision used our NVIDIA image as the live runtime, reasoning that
# the installer would then display correctly on a DSC panel. It produced a live
# session that booted to a permanently black screen with no console: the NVIDIA
# kernel module does not come up in the live overlay, so with nvidia_drm.modeset
# set, KMS never initialises and nothing is ever drawn. Do not "improve" this
# back - the installer's display fix belongs in installer/iso.yaml, and the
# installed system gets its NVIDIA arguments from kargs.d.
#
# bootc-image-builder cannot build ISOs from Bazzite images - it depsolves at
# build time and trips over Bazzite's third-party repos - so titanoboa is the
# only ISO path here.

on:
  workflow_dispatch:

env:
  IMAGE_NAME: bazzite-mattsumoto-nvidia-open  # must match image-template.env
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  # The live environment. Plain Bazzite, no NVIDIA driver - see the note above.
  LIVE_BASE_IMAGE: "ghcr.io/ublue-os/bazzite:stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live ISO
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      # The live image embeds the full payload image, so container storage far
      # exceeds a stock runner's disk. Bazzite solves this with a compressed
      # btrfs loopback; without it the build dies on ENOSPC partway through.
      - name: Mount container storage on a btrfs loopback
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true
          df -h /mnt/podman-storage

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          # Registries reject uppercase; the repo owner may contain it.
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "iso_name=${IMAGE_NAME,,}-$(date +%Y%m%d)-live-amd64.iso" >> "${GITHUB_OUTPUT}"

      # sys_admin + label=disable are required: build.sh remounts /proc/sys and
      # runs podman inside the build to embed the payload image.
      - name: Build installer image
        run: |
          set -euxo pipefail
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${LIVE_BASE_IMAGE}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${{ steps.ref.outputs.image }}" \
            --build-arg FLATPAK_DIR_SHORTNAME="kde_flatpaks" \
            -t localhost/payload:latest installer/

      - name: Show disk usage
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img || true

      # Titanoboa mounts the image with `sudo podman --mount type=image`, so it
      # must live in root's storage - which it does, having just been built with
      # sudo podman build above.
      #
      # Bazzite currently pins Zeglius/titanoboa@revamp-pr. We use the canonical
      # action; our installer/ tree satisfies its documented iso.yaml contract
      # (label + grub2.entries). Switch to the fork if this regresses.
      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ github.workspace }}/${{ steps.ref.outputs.iso_name }}

      # Titanoboa resolves iso-dest relative to its own action directory, not the
      # workspace, so the ISO does not land where the input path suggests. Always
      # use the action's reported output rather than reconstructing the path.
      - name: Stage ISO and checksum
        id: stage
        run: |
          set -euxo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          test -n "${ISO_PATH}"
          test -f "${ISO_PATH}"
          ISO_NAME="$(basename "${ISO_PATH}")"
          UPLOAD_DIR="${GITHUB_WORKSPACE}/upload"
          mkdir -p "${UPLOAD_DIR}"
          mv "${ISO_PATH}" "${UPLOAD_DIR}/${ISO_NAME}"
          cd "${UPLOAD_DIR}"
          ls -lh "${ISO_NAME}"
          sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM"
          echo "dir=${UPLOAD_DIR}" >> "${GITHUB_OUTPUT}"
          echo "name=${ISO_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          # Already compressed; re-zipping only costs time on a multi-GB file.
          compression-level: 0
          retention-days: 7
          overwrite: true
