---
name: Build live ISO

# Builds a live ISO with titanoboa - the same tool Bazzite uses for its own
# ISOs. This replaced bootc-image-builder's anaconda-iso path, which repeatedly
# failed on Bazzite images: bib depsolves against the image's repo config at
# build time, so it trips over third-party repos (Terra) and needs a declared
# root filesystem, neither of which upstream Bazzite has to care about.
#
# Titanoboa consumes the already-published container image, so nothing here
# depends on package resolution.

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build live ISO
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: read

    steps:
      # The image is several GB and the ISO larger still; the default runner
      # does not have room for both without clearing the preinstalled toolchains.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          # Container registries reject uppercase; the repo owner may contain it.
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "iso_name=${IMAGE_NAME,,}-$(date +%Y%m%d).iso" >> "${GITHUB_OUTPUT}"

      - name: Show free space before build
        run: df -h /

      # Titanoboa mounts the image from local container storage rather than
      # pulling it, and fails with `image not known` if it is not already there.
      - name: Pull image into local storage
        run: |
          set -euo pipefail
          podman pull "${{ steps.ref.outputs.image }}"
          podman images

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          iso-dest: ${{ github.workspace }}/${{ steps.ref.outputs.iso_name }}

      - name: Checksum
        id: sum
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          iso="${{ steps.ref.outputs.iso_name }}"
          test -f "${iso}"
          sha256sum "${iso}" > "${iso}.sha256"
          ls -lh "${iso}"
          cat "${iso}.sha256"

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.ref.outputs.iso_name }}
          path: |
            ${{ github.workspace }}/${{ steps.ref.outputs.iso_name }}
            ${{ github.workspace }}/${{ steps.ref.outputs.iso_name }}.sha256
          if-no-files-found: error
          # The ISO is already compressed; zipping again only costs time.
          compression-level: 0
          retention-days: 7
          overwrite: true
